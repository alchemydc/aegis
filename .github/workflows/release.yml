name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['plugin--release_created'] }}
      tag_name: ${{ steps.release.outputs['plugin--tag_name'] }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build zip
        run: npm run zip
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: Attach Chrome zip to release
        run: gh release upload "$TAG" .output/*-chrome.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Build Firefox zip
        run: npm run zip:firefox
        env:
          COMMIT_SHA: ${{ github.sha }}

      # Unlisted channel: AMO signs the XPI without publishing it on addons.mozilla.org.
      # web-ext is invoked via npx (not a dependency) because it pulls in vulnerable deps.
      - name: Sign Firefox build
        run: >-
          npx --yes web-ext@10.7.0 sign
          --channel unlisted
          --source-dir .output/firefox-mv3
          --upload-source-code .output/*-sources.zip
          --artifacts-dir .output/signed
          --approval-timeout 900000
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Attach Firefox XPI to release
        run: gh release upload "$TAG" .output/signed/*.xpi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
